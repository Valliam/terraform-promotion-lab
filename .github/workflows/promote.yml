name: Promote Release

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to promote to
        required: true
        type: choice
        options:
          - staging
          - prod
      release_ref:
        description: Exact commit SHA that already passed DEV
        required: true
        type: string

permissions:
  contents: read

jobs:
  promote:
    name: Promote to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}

    steps:
      - name: Checkout exact release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Verify release is from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "${{ inputs.release_ref }}" origin/main

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform init
        working-directory: infra/envs/${{ inputs.target_environment }}
        run: terraform init -input=false

      - name: Terraform plan
        working-directory: infra/envs/${{ inputs.target_environment }}
        run: >-
          terraform plan
          -input=false
          -out=tfplan
          -var-file=../../config/release.tfvars
          -var="release_version=${{ inputs.release_ref }}"

      - name: Terraform apply
        working-directory: infra/envs/${{ inputs.target_environment }}
        run: terraform apply -input=false tfplan

      - name: Show environment output
        working-directory: infra/envs/${{ inputs.target_environment }}
        run: terraform output -json

      - name: Upload state (lab only)
        uses: actions/upload-artifact@v4
        with:
          name: lab-tfstate-${{ inputs.target_environment }}-${{ github.run_id }}
          path: infra/envs/${{ inputs.target_environment }}/terraform.tfstate
          if-no-files-found: error
